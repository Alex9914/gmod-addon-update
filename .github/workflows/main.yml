name: Build and push image

# This runs on the SCRIPT's own repo (this repo) — not the addon repos.
# Every push to main builds the Dockerfile here and publishes it to
# GitHub Container Registry (ghcr.io), which the Unraid template pulls from.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove old packages
        uses: actions/delete-package-versions@v5
        with: 
          package-name: env.IMAGE_NAME
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'false'